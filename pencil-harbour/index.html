<script type="module">
import * as THREE from 'three';

// ---------- seeded random ----------
let _s = 1234567;
const rnd = () => { _s = (_s * 16807) % 2147483647; return (_s - 1) / 2147483646; };
const rr = (a, b) => a + (b - a) * rnd();
const pick = arr => arr[Math.floor(rnd() * arr.length)];

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false });
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfd3ea);
scene.fog = new THREE.Fog(0xd8dfe8, 140, 420);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.3, 900);

const hemi = new THREE.HemisphereLight(0xe6efff, 0x9a8a6a, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.5);
sun.position.set(45, 80, 45);
sun.target.position.set(0, 0, -15);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, near: 1, far: 260 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);

// ---------- helpers ----------
function RoundedBox(w, h, d, r) {
  const g = new THREE.BoxGeometry(w, h, d, 6, 6, 6), p = g.attributes.position, v = new THREE.Vector3(), c = new THREE.Vector3();
  const ix = w / 2 - r, iy = h / 2 - r, iz = d / 2 - r;
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); c.set(Math.max(-ix, Math.min(ix, v.x)), Math.max(-iy, Math.min(iy, v.y)), Math.max(-iz, Math.min(iz, v.z))); v.sub(c).normalize().multiplyScalar(r).add(c); p.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals(); return g;
}
const matCache = {};
function mat(color) {
  if (!matCache[color]) matCache[color] = new THREE.MeshLambertMaterial({ color });
  return matCache[color];
}
function mesh(geo, color, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
  const m = new THREE.Mesh(geo, typeof color === 'number' ? mat(color) : color);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m);
  return m;
}
const box = (w, h, d, c, x, y, z, p) => mesh(new THREE.BoxGeometry(w, h, d), c, x, y, z, p);
const colliders = []; // {minX,maxX,minZ,maxZ,h}
const addCol = (x, z, w, d, h = 3) => colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2, h });
const sstep = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
const vnoise = (x, z) => Math.sin(x * 0.13 + Math.sin(z * 0.07) * 2) * Math.cos(z * 0.11 - x * 0.05);

// ---------- ground ----------
const HILL_Z = -18, EDGE = 54;
function hillH(x, z) {
  const t = HILL_Z - z;
  if (t <= 0) return 0;
  const s = Math.min(t / 6, 1);
  return Math.min(t * 0.3, 15) + Math.sin(x * 0.11) * Math.sin(z * 0.09) * 1.2 * s + Math.max(0, Math.abs(x) - 30) * 0.12 * s;
}
// whole landscape incl. headlands that wrap the bay on both sides
function terrainH(x, z) {
  const e = sstep(EDGE, 82, Math.abs(x));
  const peak = 7 + vnoise(x, z) * 2.2 + Math.max(0, Math.abs(x) - 82) * 0.15;
  if (z > HILL_Z) {
    const s = sstep(8, 55, z);
    const base = z > 0.4 ? -3 : -0.05;
    return base * (1 - e) + (peak * (1 - s) - 3 * s) * e;
  }
  return Math.max(hillH(x, z), e * (peak + (HILL_Z - z) * 0.3));
}
const onPier = (x, z) => Math.abs(x) < 2.1 && z >= -1.5 && z <= 22.5;
function groundAt(x, z) { if (onPier(x, z) && z > 0) return 0.25; if (z > HILL_Z) return 0; return terrainH(x, z); }
function walkable(x, z) {
  if (onPier(x, z)) return true;
  return x > -EDGE + 0.5 && x < EDGE - 0.5 && z < -0.3 && z > -88;
}

// ---------- textures (all drawn in code) ----------
function canvasTex(size, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const cobbleTex = canvasTex(512, (g, S) => {
  g.fillStyle = '#a99c84'; g.fillRect(0, 0, S, S);
  for (let y = 0; y < S; y += 21) {
    let x = -rr(0, 30);
    while (x < S) {
      const w = rr(24, 42), v = 196 + Math.floor(rnd() * 34), r = 6;
      g.fillStyle = `rgb(${v},${v - 9},${v - 28})`;
      g.beginPath(); g.moveTo(x + r + 2, y + 2); g.arcTo(x + w, y + 2, x + w, y + 19, r); g.arcTo(x + w, y + 19, x + 2, y + 19, r); g.arcTo(x + 2, y + 19, x + 2, y + 2, r); g.arcTo(x + 2, y + 2, x + w, y + 2, r); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(x + 5, y + 4, w - 9, 3);
      g.fillStyle = 'rgba(60,50,40,0.15)'; g.fillRect(x + 4, y + 15, w - 7, 3);
      x += w + 1;
    }
  }
}, 22, 4);
const plasterTex = canvasTex(256, (g, S) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 2600; i++) { const v = 200 + Math.floor(rnd() * 55); g.fillStyle = `rgba(${v},${v},${v - 6},0.5)`; g.fillRect(rnd() * S, rnd() * S, rr(1, 5), rr(1, 5)); }
  for (let i = 0; i < 14; i++) { const x = rnd() * S; const gr = g.createLinearGradient(0, 0, 0, S); gr.addColorStop(0, 'rgba(120,110,100,0)'); gr.addColorStop(1, 'rgba(120,110,100,0.12)'); g.fillStyle = gr; g.fillRect(x, rnd() * S * 0.5, rr(3, 10), S); }
  for (let i = 0; i < 6; i++) { g.fillStyle = 'rgba(150,140,120,0.12)'; g.beginPath(); g.ellipse(rnd() * S, rnd() * S, rr(10, 40), rr(6, 20), rnd() * 3, 0, 7); g.fill(); }
}, 0.25, 0.25);
const tileTex = canvasTex(128, (g, S) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, S, S);
  for (let y = 0; y < S; y += 16) for (let x = (y / 16) % 2 * 8 - 8; x < S + 16; x += 16) {
    const v = 205 + Math.floor(rnd() * 50); g.fillStyle = `rgb(${v},${v},${v})`;
    g.beginPath(); g.arc(x + 8, y, 8, 0, Math.PI); g.fill();
    g.strokeStyle = 'rgba(80,60,50,0.45)'; g.lineWidth = 1.5; g.beginPath(); g.arc(x + 8, y, 8, 0, Math.PI); g.stroke();
  }
}, 0.7, 0.7);
const blockTex = canvasTex(256, (g, S) => {
  g.fillStyle = '#8e8270'; g.fillRect(0, 0, S, S);
  for (let y = 0; y < S; y += 32) for (let x = (y / 32) % 2 * 30 - 30; x < S; x += 60) {
    const v = 160 + Math.floor(rnd() * 40); g.fillStyle = `rgb(${v},${v - 8},${v - 24})`; g.fillRect(x + 2, y + 2, 56, 28);
  }
}, 30, 1);

// ---------- quay ----------
const QW = EDGE * 2 + 4;
const quay = mesh(new THREE.BoxGeometry(QW, 3, 19), new THREE.MeshLambertMaterial({ map: cobbleTex }), 0, -1.5, -9.5);
quay.castShadow = false;
mesh(new THREE.BoxGeometry(QW, 2.6, 0.8), new THREE.MeshLambertMaterial({ map: blockTex }), 0, -1.3, 0.1);
box(QW, 0.5, 0.86, 0x5d6b5a, 0, -0.95, 0.12); // wet algae band
box(QW, 0.14, 1.1, 0xe4dac6, 0, 0.07, -0.5); // curb
const bollardGeo = new THREE.LatheGeometry([[0.001, 0], [0.34, 0], [0.3, 0.08], [0.26, 0.5], [0.3, 0.62], [0.36, 0.7], [0.3, 0.8], [0.001, 0.84]].map(([r, y]) => new THREE.Vector2(r, y)), 14);
for (let x = -EDGE + 3; x <= EDGE - 3; x += 4.2) { if (Math.abs(x) < 3) continue; mesh(bollardGeo, 0x3e3a38, x, 0.14, -0.5); addCol(x, -0.5, 0.7, 0.7, 1); }
// rocks at the foot of the quay wall
{
  const rg = new THREE.DodecahedronGeometry(0.6, 0), n = 70;
  const im = new THREE.InstancedMesh(rg, new THREE.MeshLambertMaterial({ color: 0xffffff }), n), m4 = new THREE.Matrix4(), c = new THREE.Color(), q = new THREE.Quaternion(), e = new THREE.Euler();
  for (let i = 0; i < n; i++) {
    let x = rr(-EDGE, EDGE); if (Math.abs(x) < 3) x += 5;
    const s = rr(0.6, 1.5); e.set(rnd() * 3, rnd() * 3, rnd() * 3); q.setFromEuler(e);
    m4.compose(new THREE.Vector3(x, -1.1, rr(0.7, 1.6)), q, new THREE.Vector3(s, s * 0.7, s)); im.setMatrixAt(i, m4); im.setColorAt(i, c.setHex(pick([0x8d8a7e, 0x7a786c, 0x9c9888])));
  }
  im.receiveShadow = true; scene.add(im);
}
// end walls closing the promenade
for (const sx of [-1, 1]) {
  mesh(new THREE.BoxGeometry(1.0, 1.3, 18.5), new THREE.MeshLambertMaterial({ map: blockTex }), sx * (EDGE + 0.2), 0.65, -9.3);
  for (let z = -17; z <= -2; z += 1.6) mesh(new THREE.SphereGeometry(rr(0.7, 1.0), 8, 6), pick([0x4f7a4a, 0x5a8a50, 0x46703f]), sx * (EDGE + 0.6), 1.6 + rr(-0.1, 0.3), z);
}

// ---------- terrain mesh (hill + headlands) ----------
const terrGeo = new THREE.PlaneGeometry(340, 170, 170, 85);
terrGeo.rotateX(-Math.PI / 2); terrGeo.translate(0, 0, -15);
{ const p = terrGeo.attributes.position; for (let i = 0; i < p.count; i++) p.setY(i, terrainH(p.getX(i), p.getZ(i)) - 0.02); terrGeo.computeVertexNormals(); }
terrGeo.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(terrGeo.attributes.position.count * 3), 3));
const terrain = mesh(terrGeo, new THREE.MeshLambertMaterial({ vertexColors: true }));
terrain.castShadow = false;

// mountains
for (let i = 0; i < 9; i++) {
  const x = -260 + i * 65 + rr(-15, 15), z = rr(-250, -200), h = rr(60, 105), r = rr(55, 80);
  mesh(new THREE.ConeGeometry(r, h, 7), 0xa49dc6, x, h / 2 - 5, z, scene, false);
  const ch = h * 0.28; mesh(new THREE.ConeGeometry(r * 0.28 * 1.02, ch, 7), 0xf6f4f8, x, h - 5 - ch / 2 + 0.3, z, scene, false);
}

// ---------- water ----------
const W = (x, z, t) => Math.sin(x * 0.25 + t * 1.3) * 0.13 + Math.sin(z * 0.31 + t * 1.7 + x * 0.1) * 0.11 + Math.sin((x + z) * 0.9 + t * 2.6) * 0.035;
const waterGeo = new THREE.PlaneGeometry(800, 420, 110, 60); waterGeo.rotateX(-Math.PI / 2); waterGeo.translate(0, 0, 190);
{
  const p = waterGeo.attributes.position, cols = new Float32Array(p.count * 3), shallow = new THREE.Color(0x63c6cc), deep = new THREE.Color(0x2c6f9c), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const d = sstep(0, 70, z) * 0.85 + (vnoise(x * 1.7, z * 1.7) * 0.5 + 0.5) * 0.15;
    c.copy(shallow).lerp(deep, d); cols.set([c.r, c.g, c.b], i * 3);
  }
  waterGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
}
const water = mesh(waterGeo, new THREE.MeshPhongMaterial({ vertexColors: true, shininess: 90, specular: 0xd8f0ff }), 0, -0.9, 0); water.castShadow = false;
const wBase = Float32Array.from(waterGeo.attributes.position.array);
// foam along the quay wall
const foamMat = new THREE.MeshBasicMaterial({ color: 0xfbfaf4, transparent: true, opacity: 0.85, depthWrite: false });
const foamGeo = new THREE.PlaneGeometry(QW, 0.9, 120, 1); foamGeo.rotateX(-Math.PI / 2);
const foam = new THREE.Mesh(foamGeo, foamMat); foam.position.set(0, 0, 0.95); scene.add(foam);
const foamBase = Float32Array.from(foamGeo.attributes.position.array);
const rings = [];

// ---------- pier ----------
{
  const plank = new THREE.BoxGeometry(4, 0.2, 0.46);
  const inst = new THREE.InstancedMesh(plank, new THREE.MeshLambertMaterial({ color: 0xffffff }), 46); inst.castShadow = inst.receiveShadow = true;
  const m4 = new THREE.Matrix4(), c = new THREE.Color();
  for (let i = 0; i < 46; i++) { m4.makeRotationY(rr(-0.02, 0.02)); m4.setPosition(rr(-0.05, 0.05), 0.15, 0.4 + i * 0.5); inst.setMatrixAt(i, m4); inst.setColorAt(i, c.setHex(pick([0x8a6a4e, 0x7d5f45, 0x957257, 0x86664a]))); }
  scene.add(inst);
  box(0.25, 0.25, 22, 0x5c4636, -1.9, -0.05, 11.5); box(0.25, 0.25, 22, 0x5c4636, 1.9, -0.05, 11.5);
  for (let z = 1; z <= 22; z += 3.5) for (const s of [-1, 1]) {
    mesh(new THREE.CylinderGeometry(0.22, 0.25, 3.2, 8), 0x5c4636, s * 2.15, -0.9, z);
    mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.18, 8), 0x3e322a, s * 2.15, 0.78, z);
    const r = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.62, 18), foamMat); r.rotation.x = -Math.PI / 2; r.position.set(s * 2.15, -0.8, z); scene.add(r); rings.push(r);
  }
  // rope coil + crates at the pier end
  const coil = mesh(new THREE.TorusGeometry(0.35, 0.12, 6, 14), 0xc9b48a, 1.2, 0.35, 21); coil.rotation.x = Math.PI / 2;
  box(0.8, 0.7, 0.8, 0xa47e55, -1.3, 0.6, 21.2); box(0.6, 0.5, 0.6, 0x94704a, -1.25, 1.2, 21.2);
}
// buoys
const buoys = [];
for (const [x, z] of [[-10, 18], [9, 26], [22, 16], [-24, 12]]) {
  const g = new THREE.Group();
  mesh(new THREE.SphereGeometry(0.45, 10, 8), 0xe04a3c, 0, 0, 0, g); mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.2, 10), 0xf4f0e6, 0, 0.15, 0, g);
  mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.8, 5), 0x333333, 0, 0.6, 0, g);
  g.position.set(x, -0.8, z); scene.add(g); buoys.push({ g, x, z });
}

// ---------- houses ----------
const houseColors = [0xe9a0a6, 0x9fd3b0, 0x8fb5e0, 0xf2d27c, 0xe8956a, 0xb8a4dc, 0xf3e6c9, 0xe58f8f, 0xa8d8c8, 0xf0b77a, 0xc6b2e2, 0x9cc4e4, 0xf2c4a0];
const roofColors = [0xc0583e, 0xb24e36, 0xcf6b4a, 0xa94a35];
const shutterColors = [0x5f8f6a, 0x4f7896, 0x6f9a5a, 0x8a6a4e];
const winMat = new THREE.MeshPhongMaterial({ color: 0x3e4f62, specular: 0x9fb8d0, shininess: 60, emissive: 0x000000 });
const win = [], shut = [], flowerBox = [], flowers = [], frames = [], arches = [], frameArches = [], sills = [], cornices = [], leaves = [];
const chimneys = [];
const houses = [];
const roofMats = {};
const roofMat = c => roofMats[c] || (roofMats[c] = new THREE.MeshLambertMaterial({ color: c, map: tileTex }));
let hx = -46;
const alleyAfter = new Set([3, 8]);
const N_HOUSES = 13;
// window helper: face = 'f' front, 'b' back, 'l' left side, 'r' right side
function addWindow(px, py, pz, face, sc, arched, flowerChance) {
  const rot = face === 'l' || face === 'r' ? Math.PI / 2 : 0;
  const out = face === 'f' ? [0, 0, 1] : face === 'b' ? [0, 0, -1] : face === 'l' ? [-1, 0, 0] : [1, 0, 0];
  const side = face === 'l' || face === 'r' ? [0, 0, 1] : [1, 0, 0];
  const at = (k, a = 0) => [px + out[0] * k + side[0] * a, py, pz + out[2] * k + side[2] * a];

let actx = null;
function note(freq, t0 = 0, dur = 0.6, type = 'triangle', vol = 0.25) {
  if (!actx) return;
  const t = actx.currentTime + t0, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.05);
}

const rt = new THREE.WebGLRenderTarget(1, 1, { depthTexture: new THREE.DepthTexture(1, 1), samples: 0 });
const postMat = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: rt.texture }, tDepth: { value: rt.depthTexture },
    uRes: { value: new THREE.Vector2() }, uDpr: { value: DPR }, uSeed: { value: 0 }, uTime: { value: 0 },
    uNear: { value: camera.near }, uFar: { value: camera.far }, uWarm: { value: 0 }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    precision highp float;
    uniform sampler2D tColor; uniform sampler2D tDepth;
    uniform vec2 uRes; uniform float uDpr, uSeed, uTime, uNear, uFar, uWarm;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
    float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.03; a*=0.5; } return v; }
    float linD(float d){ float z=d*2.0-1.0; return 2.0*uNear*uFar/(uFar+uNear-z*(uFar-uNear)); }
    float hatch(vec2 p, float ang, float sp, float s){
      float c=cos(ang), sn=sin(ang);
      vec2 r = vec2(c*p.x - sn*p.y, sn*p.x + c*p.y);
      float wob = (noise(vec2(r.y*0.012, s*3.1 + ang)) - 0.5) * sp * 1.4;
      float u = (r.x + wob) / sp;
      float id = floor(u);
      float dist = abs(fract(u) - 0.5);
      float line = 1.0 - smoothstep(0.10, 0.30, dist);
      float dash = smoothstep(0.25, 0.45, noise(vec2(r.y*0.035 + id*13.7, id*3.3 + s)));
      return line * dash * mix(0.55, 1.0, hash(vec2(id, s)));
    }
    void main(){
      vec2 px = gl_FragCoord.xy / uDpr;
      vec2 jit = (vec2(noise(px*0.045 + uSeed), noise(px*0.045 + uSeed + 17.0)) - 0.5) * 2.2 * uDpr / uRes;
      vec3 col = texture2D(tColor, vUv + jit).rgb;
      col = pow(max(col, 0.0), vec3(1.0/2.2));
      float depth = texture2D(tDepth, vUv + jit).r;
      vec3 paper = mix(vec3(0.953,0.925,0.863), vec3(0.99,0.86,0.72), uWarm*0.6);
      float grain = fbm(px*0.35)*0.6 + noise(px*1.4)*0.4;
      vec3 outc;
      if (depth > 0.99999) {
        float cl = fbm(vec2(vUv.x*2.6 + uTime*0.004, vUv.y*4.5));
        float cloud = smoothstep(0.58, 0.74, cl - (vUv.y - 0.6)*0.15);
        vec3 skyc = mix(vec3(0.33,0.50,0.84), vec3(0.95,0.55,0.38), uWarm);
        float dens = (1.0 - cloud) * mix(0.55, 1.0, smoothstep(0.35, 1.0, vUv.y));

        float l0a = linD(depth);

        float occ = 0.0;
        for (int i = 0; i < 12; i++) {

  gulls.forEach(g => { g.a += g.sp * dt; g.g.position.set(g.cx + Math.cos(g.a) * g.rad, g.y + Math.sin(t + g.a) * 0.8, g.cz + Math.sin(g.a) * g.rad); g.g.rotation.y = -g.a; const f = Math.sin(t * 6 + g.a * 9) * 0.45; g.l.rotation.z = f; g.r.rotation.z = -f; });
  puffs.forEach(p => { p.t += dt * 0.18; if (p.t > 1) p.t -= 1; const k = p.t; p.m.position.set(p.c.x + Math.sin(k * 5 + p.c.x) * 0.6 + k * 1.5, p.c.y + k * 5, p.c.z); p.m.scale.setScalar(0.3 + k * 1.4 * (1 - k * 0.6)); });
  flagPos.forEach((p, i) => { eul.set(Math.sin(t * 2.2 + i * 0.7) * 0.35, 0, 0); q.setFromEuler(eul); m4.compose(tmp.set(p[0], p[1], p[2]), q, one); flagsMesh.setMatrixAt(i, m4); });
  flagsMesh.instanceMatrix.needsUpdate = true;

  // render
  postMat.uniforms.uSeed.value = Math.floor(t * 8) % 4 * 7.31;
  postMat.uniforms.uTime.value = t;
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}
document.getElementById('loading').style.display = 'none';
// test hook: #play=x,z,yaw,pitch,dist jumps straight into the game at a spot
if (location.hash.startsWith('#play')) {
  document.getElementById('go').onclick();
  const v = (location.hash.split('=')[1] || '').split(',').map(Number);
  if (v.length >= 2 && !isNaN(v[0])) { P.pos.set(v[0], groundAt(v[0], v[1]), v[1]); }
  if (v.length >= 3) cam.yaw = v[2]; if (v.length >= 4) cam.pitch = v[3]; if (v.length >= 5) cam.dist = v[4];
  hint.style.display = 'none';
}
loop();
</script>
